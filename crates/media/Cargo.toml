[package]
name = "media"
description = "Bounded multimedia requests and optional native backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["dep:media-backend-native"]
ffmpeg = ["dep:media-backend-ffmpeg", "media-backend-ffmpeg/linked"]
ffmpeg-audio = ["native", "ffmpeg", "media-backend-ffmpeg/audio"]
cuda = ["dep:media-backend-cuda", "media-backend-ffmpeg?/cuda", "media-interop?/cuda"]
cuda-filters = ["cuda", "ffmpeg", "media-backend-ffmpeg/cuda-filters"]
interop = ["dep:media-interop"]
icc = ["interop", "media-interop/icc"]
http = ["media-io/http"]
http-tls = ["http", "media-io/http-tls"]

[dependencies]
media-core.workspace = true
media-io.workspace = true
media-pipeline.workspace = true
media-backend-native = { workspace = true, optional = true }
media-backend-ffmpeg = { workspace = true, optional = true }
media-backend-cuda = { workspace = true, optional = true }
media-interop = { workspace = true, optional = true }

[dev-dependencies]
gif.workspace = true
png.workspace = true
tiff.workspace = true
cudarc.workspace = true

[lints]
workspace = true

[[example]]
name = "cpu_image"
required-features = ["native"]

[[example]]
name = "audio_windows"
required-features = ["native"]

[[example]]
name = "workflow_bench"
required-features = ["native", "ffmpeg", "interop"]

[[example]]
name = "gpu_video_tensor"
required-features = ["ffmpeg", "cuda", "interop"]

[[example]]
name = "transcode_passthrough"
required-features = ["cuda-filters"]

[[example]]
name = "gpu_workflow_bench"
required-features = ["ffmpeg", "cuda", "interop"]

[[example]]
name = "matched_bench_bridge"
crate-type = ["cdylib"]
required-features = ["ffmpeg", "cuda", "interop"]
